name: CrossPulse hourly scanner

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosspulse-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private CrossPulse source
        uses: actions/checkout@v4
        with:
          repository: Nitish0514/banik-crosspulse-signals
          ref: main
          token: ${{ secrets.CROSSPULSE_REPO_TOKEN }}
          path: crosspulse
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crosspulse/requirements.txt

      - name: Install runtime
        working-directory: crosspulse
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify production engine
        working-directory: crosspulse
        run: |
          python -m compileall -q .
          python - <<'PY'
          import backtester
          expected = "futures-crossover-confidence-v8.2-pullback-confirmed"
          assert backtester.STRATEGY_VERSION == expected, backtester.STRATEGY_VERSION
          print(f"Verified {expected}")
          PY

      - name: Run CoinDCX signal scan
        working-directory: crosspulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CROSSPULSE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CROSSPULSE_TELEGRAM_CHAT_ID }}
          CONTROL_API_URL: "https://banik-crosspulse-watchdog.niteshrockzz05.workers.dev"
          CONTROL_API_SECRET: ${{ secrets.CROSSPULSE_CONTROL_API_SECRET }}
          SCAN_CONCURRENCY: "12"
          KEEP_COMPUTER_AWAKE: "false"
          PAPER_TRACKING: "false"
          EARLY_WATCH_15M: "false"
        run: python cloud_runner.py

      - name: Notify owner if scan fails
        if: failure()
        working-directory: crosspulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CROSSPULSE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CROSSPULSE_TELEGRAM_CHAT_ID }}
        run: python cloud_failure_notifier.py || true

      - name: Persist scanner state to private repository
        if: always()
        working-directory: crosspulse
        env:
          CROSSPULSE_REPO_TOKEN: ${{ secrets.CROSSPULSE_REPO_TOKEN }}
        run: |
          git config user.name "crosspulse-public-scheduler"
          git config user.email "crosspulse-scheduler@users.noreply.github.com"
          git add .cloud_state/alerts_sent.json .cloud_state/health_notification.json \
            .cloud_state/validation_summary.json .cloud_state/active_strategy.json \
            .cloud_state/cloud_status.json 2>/dev/null || true
          git add -f reports/analytics/*.json reports/analytics/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update cloud signal state [skip ci]"
          git push origin HEAD:main
